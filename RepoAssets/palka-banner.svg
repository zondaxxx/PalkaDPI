<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">PalkaDPI for iOS and Android</title>
  <desc id="desc">Dark monochrome PalkaDPI banner: the same app on an iPhone and an Android phone</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="48%" r="68%">
      <stop offset="0" stop-color="#050508" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".78"/>
    </radialGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8ecf8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="iphone"><rect width="176" height="330" rx="30"/></clipPath>
    <clipPath id="android"><rect width="176" height="330" rx="22"/></clipPath>
    <!-- one phone screen, reused by both devices -->
    <g id="screen">
      <rect width="176" height="330" fill="#050508"/>
      <rect width="176" height="330" fill="url(#grid)"/>
      <g transform="translate(14 44)">
        <rect width="22" height="22" rx="7" fill="#15151c" stroke="#ffffff" stroke-opacity=".1"/>
        <g transform="translate(4 3) scale(.017)">
          <path fill="#f7f8fc" fill-rule="evenodd" d="M224 154h330c164 0 266 90 266 230S718 614 554 614H414v256H224V154Zm190 162v136h132c56 0 86-24 86-68s-30-68-86-68H414Z"/>
          <path d="M682 354h96v32h-96zM630 472h112v32H630z" fill="#4ade80"/>
        </g>
        <text x="30" y="16" fill="#fff" fill-opacity=".96" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="800" letter-spacing="-.6">PalkaDPI</text>
        <circle cx="136" cy="11" r="11" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
      </g>
      <g transform="translate(10 80)">
        <rect width="156" height="148" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity=".15"/>
        <circle cx="16" cy="18" r="3.5" fill="#22c55e" filter="url(#glow)"/>
        <text x="26" y="21" fill="#a8f0bf" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" font-weight="700" letter-spacing=".6">ЗАЩИТА АКТИВНА</text>
        <rect x="118" y="9" width="28" height="17" rx="8.5" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".07"/>
        <text x="132" y="21" text-anchor="middle" fill="#ffffff" fill-opacity=".43" font-family="ui-monospace,Menlo,monospace" font-size="7.5" font-weight="600">ON</text>
        <text x="12" y="52" fill="#fff" fill-opacity=".96" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="800" letter-spacing="-.7">Обход работает</text>
        <rect x="12" y="62" width="120" height="5" rx="2.5" fill="#ffffff" fill-opacity=".16"/>
        <rect x="12" y="72" width="90" height="5" rx="2.5" fill="#ffffff" fill-opacity=".10"/>
        <rect x="12" y="90" width="132" height="34" rx="10" fill="url(#button)"/>
        <text x="78" y="111" text-anchor="middle" fill="#07070e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="800">⏻  Отключить</text>
        <text x="12" y="140" fill="#ffffff" fill-opacity=".43" font-family="ui-monospace,Menlo,monospace" font-size="6.5">↑ 1.2 MB · ↓ 18 MB · 9 421 pkt</text>
      </g>
      <g transform="translate(10 238)">
        <rect width="156" height="40" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/>
        <rect x="10" y="9" width="22" height="22" rx="7" fill="#ffffff" fill-opacity=".07"/>
        <text x="21" y="24" text-anchor="middle" fill="#fff" font-size="11">✦</text>
        <text x="40" y="18" fill="#fff" fill-opacity=".96" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" font-weight="700">Автоматическая настройка</text>
        <rect x="40" y="24" width="84" height="4" rx="2" fill="#ffffff" fill-opacity=".14"/>
      </g>
      <g transform="translate(10 286)">
        <rect width="156" height="44" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/>
        <circle cx="18" cy="15" r="2.5" fill="#22c55e"/>
        <text x="26" y="18" fill="#fff" fill-opacity=".9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8" font-weight="600">Discord</text>
        <text x="146" y="18" text-anchor="end" fill="#fff" fill-opacity=".9" font-family="ui-monospace,Menlo,monospace" font-size="8">142 ms</text>
        <circle cx="18" cy="32" r="2.5" fill="#22c55e"/>
        <text x="26" y="35" fill="#fff" fill-opacity=".9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8" font-weight="600">YouTube</text>
        <text x="146" y="35" text-anchor="end" fill="#fff" fill-opacity=".9" font-family="ui-monospace,Menlo,monospace" font-size="8">96 ms</text>
      </g>
    </g>
  </defs>

  <rect width="1200" height="400" rx="24" fill="#050508"/>
  <rect width="1200" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="400" rx="24" fill="url(#vignette)"/>

  <g transform="translate(84 96)">
    <circle cx="12" cy="13" r="6" fill="#4ade80" filter="url(#glow)"/>
    <text x="32" y="19" fill="#ffffff" fill-opacity=".68" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="600" letter-spacing="2">LOCAL · PRIVATE · SYSTEM-WIDE</text>
    <text x="0" y="104" fill="#ffffff" fill-opacity=".97" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="78" font-weight="800" letter-spacing="-4">PalkaDPI</text>
    <text x="3" y="151" fill="#ffffff" fill-opacity=".68" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22">DPI bypass for iOS and Android</text>
    <text x="3" y="181" fill="#ffffff" fill-opacity=".43" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18">on-device ByeDPI core — no remote VPN server</text>
    <g transform="translate(3 206)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600">
      <rect width="92" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="46" y="20" text-anchor="middle" fill="#ffffff" fill-opacity=".8">iOS 14+</text>
      <rect x="104" width="124" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="166" y="20" text-anchor="middle" fill="#ffffff" fill-opacity=".8">Android 5+</text>
    </g>
  </g>

  <!-- iPhone -->
  <g transform="translate(760 36)">
    <rect x="-6" y="-6" width="188" height="342" rx="36" fill="#0d0d12" stroke="#ffffff" stroke-opacity=".14"/>
    <g clip-path="url(#iphone)"><use href="#screen"/></g>
    <rect x="58" y="10" width="60" height="18" rx="9" fill="#000"/>
    <text x="22" y="24" fill="#fff" fill-opacity=".9" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="600">9:41</text>
  </g>
  <!-- Android -->
  <g transform="translate(968 60)">
    <rect x="-6" y="-6" width="188" height="342" rx="26" fill="#0d0d12" stroke="#ffffff" stroke-opacity=".14"/>
    <g clip-path="url(#android)"><use href="#screen"/></g>
    <circle cx="88" cy="16" r="5" fill="#000"/>
    <text x="14" y="21" fill="#fff" fill-opacity=".9" font-family="Roboto,-apple-system,sans-serif" font-size="10" font-weight="500">12:30</text>
    <rect x="68" y="324" width="40" height="3" rx="1.5" fill="#ffffff" fill-opacity=".5"/>
  </g>
</svg>
