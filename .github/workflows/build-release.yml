name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    name: Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Validate project files
        run: |
          plutil -lint \
            Example/Sources/ByeByeDPI/Info.plist \
            Example/Sources/ByeByeDPITun/Info.plist \
            Example/Sources/ByeByeDPI/ByeByeDPI.entitlements \
            Example/Sources/ByeByeDPITun/ByeByeDPITun.entitlements
          bash -n scripts/build_unsigned_ipa.sh
          swift scripts/validate_strategy_catalog.swift strategy-catalog.json
          xcodebuild -project SwByeDPI.xcodeproj -list

      - name: Build unsigned IPA
        env:
          PALKA_BUNDLE_ID: io.github.zondaxxx.bvdpiios
          PALKA_APP_GROUP: group.io.github.zondaxxx.bvdpiios
        run: ./scripts/build_unsigned_ipa.sh

      - name: Verify package
        run: |
          unzip -t packages/PalkaDPI-unsigned.ipa
          unzip -l packages/PalkaDPI-unsigned.ipa | grep -F "Payload/PalkaDPI.app/PlugIns/ByeByeDPITun.appex/"
          shasum -a 256 packages/PalkaDPI-unsigned.ipa > packages/PalkaDPI-unsigned.ipa.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PalkaDPI-${{ github.sha }}
          path: |
            packages/PalkaDPI-unsigned.ipa
            packages/PalkaDPI-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              packages/PalkaDPI-unsigned.ipa \
              packages/PalkaDPI-unsigned.ipa.sha256 \
              --clobber
          else
            gh release create "$tag" \
              packages/PalkaDPI-unsigned.ipa \
              packages/PalkaDPI-unsigned.ipa.sha256 \
              --title "PalkaDPI $tag" \
              --generate-notes
          fi
